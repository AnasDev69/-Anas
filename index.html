<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>!Anas</title>
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="description" content="Page profil de !Anas — Developer basé à Lyon, France." />
  <meta name="theme-color" content="#000000" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body class="intro-locked">

  <!-- ============ ÉCRAN D'INTRO ============ -->
  <div id="intro-screen">
    <img src="intro.png" alt="" class="intro-bg" />
    <div class="intro-content">
      <h1 class="intro-title">!anas</h1>
      <p class="intro-enter">click to enter</p>
    </div>
  </div>

  <!-- ============ FOND ============ -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4" />
  </video>
  <div class="overlay"></div>

  <!-- ============ HEADER ============ -->
  <header class="header">
    <span class="logo">!anas</span>
    <button id="sound-toggle" class="icon-btn" title="Activer / couper le son" aria-label="Activer / couper le son">
      <i class="fa-solid fa-volume-high"></i>
    </button>
  </header>

  <!-- ============ PROFIL ============ -->
  <main class="main">
    <section class="profile">

      <div class="avatar-wrapper">
        <img src="avatar.jpg" alt="Avatar de !Anas" class="avatar" />
        <span class="status-dot" id="status-dot"></span>
      </div>

      <h1 class="username">!Anas</h1>

      <p class="typewriter-line">
        <span id="typewriter"></span><span class="cursor"></span>
      </p>

      <ul class="meta">
        <li><i class="fa-solid fa-location-dot"></i> Lyon, France</li>
        <li class="meta-sep" aria-hidden="true"></li>
        <li><span class="live-dot" id="discord-status-dot"></span><span id="discord-status-text">Chargement…</span></li>
      </ul>

      <div class="links">
        <a href="https://discord.gg/bluelightfa" target="_blank" rel="noopener noreferrer" class="main-btn">
          <i class="fa-brands fa-discord"></i>
          Rejoindre le Discord
        </a>

        <div class="socials">
          <a href="https://discord.com/users/664188939812208690" target="_blank" rel="noopener noreferrer" class="social-icon" title="Profil Discord" aria-label="Profil Discord">
            <i class="fa-brands fa-discord"></i>
          </a>
          <a href="https://github.com/AnasDev69" target="_blank" rel="noopener noreferrer" class="social-icon" title="GitHub" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>

      <audio id="audio" src="music.mp3" loop preload="metadata"></audio>

    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <p>© <span id="year"></span> !Anas</p>
  </footer>

  <script src="script.js?v=2"></script>
</body>
</html>
